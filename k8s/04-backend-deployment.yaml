apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-backend 
  namespace: three-tier
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend 
    template:
      metadata:
        labels:
           app: backend 
      spec:
        containers:
          - name: blog-backend-container                   
            image: chetansingh673/blog-backend:latest
            ports:
              - containerPort: 5000 
            env:
              - name: PORT 
                value: "5000"  
              - name: DB_HOST
                value: "chetan_db"
              - name: DB_PORT
                value: "5432"
              - name: DB_USER
                valueFrom:
                  secretKeyRef:
                    name: postgres-db-secret   
                    key: POSTGRES_USER
              - name: DB_PASSWORD
                valueFrom: 
                  secretKeyRef:
                    name: postgres-db-secret
                    key: POSTGRES_PASSWORD
              - name: DB_NAME
                valueFrom:
                  secretKeyRef:
                    name: postgres-db-secret
                    key: POSTGRES_DB   
