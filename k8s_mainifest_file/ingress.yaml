apiVersion: networking.k8s.io/v1
kind: Ingress 
metadata:
  name: blog-lb
  namespace: three-tier 
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    
    # Target type and Listener Port

    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetess.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/certificate-arn:   # Replace with your ACM certificate ARN
    alb-ingress.kubernetes.io/ssl-redirect: '443'

spec:
  ingressClassName: alb 
  rules:
     - hosts: blog.cloudmella.store
       http:
        paths:
          - path: /
            pathType: Prefix 
            backend:
              service:
                name: blog-frontend-service  # frontend service name we need to give here
              port:
                number: 8080